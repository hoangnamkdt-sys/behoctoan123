<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Bé Học Toán</title>

  <meta name="theme-color" content="#ff69b4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Bé Học Toán" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Thư viện Canvas-Confetti cho hiệu ứng pháo hoa -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type=number] {
      -moz-appearance: textfield;
    }

    .btn-bounce {
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn-bounce:active {
      transform: translateY(4px);
      box-shadow: none !important;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    .rabbit-3d-anim {
      animation: float 3s ease-in-out infinite;
    }

    @keyframes popIn {
      0% { transform: scale(0.3); opacity: 0; }
      70% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>

<body class="bg-amber-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">

    function BeHocToan() {

      const { useState, useEffect, useRef } = React;

      // =========================
      // STATE & REFS
      // =========================

      const [score, setScore] = useState(0);
      const [question, setQuestion] = useState(null);
      const [answer, setAnswer] = useState("");
      const [message, setMessage] = useState("");
      const [stars, setStars] = useState(0);
      const [mode, setMode] = useState("+");
      const [maxNumber, setMaxNumber] = useState(10); // Giới hạn phạm vi & kết quả tối đa là 10
      const [maxTable, setMaxTable] = useState(5);   // Dùng cho Bảng cửu chương nếu chọn Nhân/Chia
      const [history, setHistory] = useState([]);
      const [choices, setChoices] = useState([]);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);

      const [streak, setStreak] = useState(0);
      const [showBigRabbit, setShowBigRabbit] = useState(false);

      // Cài đặt thời gian học (mặc định 15 phút = 900 giây)
      const [selectedMinutes, setSelectedMinutes] = useState(15);
      const [timeLeft, setTimeLeft] = useState(15 * 60);
      const [isTimeUp, setIsTimeUp] = useState(false);
      const [unlockCode, setUnlockCode] = useState("");
      const [unlockError, setUnlockError] = useState("");

      const wrongQuestionsQueue = useRef([]);
      const isFirstAttempt = useRef(true);

      // =========================
      // QUẢN LÝ ĐẾM NGƯỢC THỜI GIAN
      // =========================

      useEffect(() => {
        if (isTimeUp) return;

        const timer = setInterval(() => {
          setTimeLeft((prev) => {
            if (prev <= 1) {
              clearInterval(timer);
              setIsTimeUp(true);
              speak("Đã hết giờ học rồi! Bé nghỉ tay một chút nhé.");
              return 0;
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(timer);
      }, [isTimeUp]);

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m < 10 ? "0" + m : m}:${s < 10 ? "0" + s : s}`;
      };

      const handleSelectDuration = (mins) => {
        setSelectedMinutes(mins);
        setTimeLeft(mins * 60);
        setIsTimeUp(false);
      };

      const handleUnlock = (e) => {
        e.preventDefault();
        if (unlockCode.trim() === "1") {
          setIsTimeUp(false);
          setTimeLeft(selectedMinutes * 60);
          setUnlockCode("");
          setUnlockError("");
          speak("Đã mở khóa! Bé tiếp tục học nhé.");
        } else {
          setUnlockError("Chưa chính xác. Nhập số 1 để tiếp tục nhé!");
        }
      };

      // =========================
      // RANDOM HỖ TRỢ TRONG KHOẢNG [min, max]
      // =========================

      const randomBetween = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

      // =========================
      // FORMAT TEXT ĐỂ ĐỌC
      // =========================

      const formatSpeakText = (text) => {
        return text
          .replace(/\+/g, " cộng ")
          .replace(/-/g, " trừ ")
          .replace(/x/g, " nhân ")
          .replace(/÷/g, " chia ")
          .replace(/=/g, " bằng ")
          .replace(/\?/g, "")
          .replace(/\s+/g, " ")
          .trim();
      };

      // =========================
      // SPEAK (GIỌNG NỮ TIẾNG VIỆT)
      // =========================

      const speak = (text) => {
        if (!window.speechSynthesis) return;

        speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = "vi-VN";
        msg.rate = 0.9;
        msg.pitch = 1.1;
        msg.volume = 1;

        const voices = speechSynthesis.getVoices();
        
        const femaleViVoice = voices.find(v => 
          v.lang.includes("vi") && 
          (v.name.toLowerCase().includes("hoaimy") || 
           v.name.toLowerCase().includes("linh") || 
           v.name.toLowerCase().includes("female") || 
           v.name.toLowerCase().includes("google"))
        ) || voices.find(v => v.lang.includes("vi"));

        if (femaleViVoice) {
          msg.voice = femaleViVoice;
        }

        speechSynthesis.speak(msg);
      };

      // =========================
      // HIỆU ỨNG PHÁO HOA
      // =========================
      const triggerFireworks = () => {
        if (typeof confetti === 'function') {
          const duration = 3 * 1000;
          const end = Date.now() + duration;

          (function frame() {
            confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 } });
            confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 } });

            if (Date.now() < end) {
              requestAnimationFrame(frame);
            }
          })();
        }
      };

      // =========================
      // TẠO CÂU HỎI
      // =========================

      const generateQuestion = () => {
        let text = "";
        let result = 0;
        let isReviewQuestion = false;

        if (wrongQuestionsQueue.current.length > 0 && Math.random() < 0.4) {
          const reviewItem = wrongQuestionsQueue.current.shift();
          text = reviewItem.text;
          result = reviewItem.result;
          isReviewQuestion = true;
        } else {
          let currentMode = mode;
          if (mode === "mix") {
            const modes = ["+", "-", "*", "/"];
            currentMode = modes[Math.floor(Math.random() * modes.length)];
          }

          let a, b;

          if (currentMode === "+") {
            // Khống chế tổng a + b <= maxNumber (mặc định maxNumber = 10)
            a = randomBetween(0, maxNumber);
            b = randomBetween(0, maxNumber - a);
            
            text = `${a} + ${b} = ?`;
            result = a + b;
          } else if (currentMode === "-") {
            // Khống chế số bị trừ a <= maxNumber và a >= b
            a = randomBetween(0, maxNumber);
            b = randomBetween(0, a);

            text = `${a} - ${b} = ?`;
            result = a - b;
          } else if (currentMode === "*") {
            a = randomBetween(1, maxTable); 
            b = randomBetween(1, 10); 
            if (Math.random() > 0.5) [a, b] = [b, a];

            text = `${a} x ${b} = ?`;
            result = a * b;
          } else if (currentMode === "/") {
            b = randomBetween(1, maxTable); 
            const quotient = randomBetween(1, 10); 
            a = b * quotient; 

            result = quotient;
            text = `${a} ÷ ${b} = ?`;
          }
        }

        isFirstAttempt.current = !isReviewQuestion;
        setQuestion({ text, result });

        // Tạo các đáp án nhiễu không vượt quá maxNumber nếu đang học Cộng/Trừ
        const upperLimit = (mode === "+" || mode === "-") ? maxNumber : Math.max(result + 5, 10);
        
        let fakeOptions = new Set();
        fakeOptions.add(result);

        while (fakeOptions.size < 4) {
          let delta = randomBetween(-3, 3);
          let fakeVal = result + delta;
          if (fakeVal >= 0 && fakeVal <= upperLimit) {
            fakeOptions.add(fakeVal);
          } else {
            fakeOptions.add(randomBetween(0, upperLimit));
          }
        }

        const arr = Array.from(fakeOptions).sort(() => Math.random() - 0.5);

        setChoices(arr);
        setAnswer("");

        setTimeout(() => {
          speak((isReviewQuestion ? "Thử lại nào. " : "Bé hãy tính. ") + formatSpeakText(text));
        }, 400);
      };

      // =========================
      // INIT
      // =========================

      useEffect(() => {
        setTimeout(() => {
          speechSynthesis.getVoices();
        }, 200);
        generateQuestion();
      }, [mode, maxNumber, maxTable]);

      // =========================
      // CHECK ĐÁP ÁN
      // =========================

      const handleSelectAnswer = (selectedVal) => {
        if (!question || isTimeUp) return;

        setAnswer(selectedVal.toString());

        const correct = Number(selectedVal) === question.result;

        if (correct) {
          let currentStreak = streak;

          if (isFirstAttempt.current) {
            setScore(prev => prev + 10);
            setStars(prev => prev + 1);
            
            currentStreak = streak + 1;
            setStreak(currentStreak);

            setHistory(prev => [
              { q: question.text, a: selectedVal, ok: true },
              ...prev.slice(0, 99),
            ]);
          } else {
            setHistory(prev => [
              { q: question.text + " (Thử lại)", a: selectedVal, ok: true },
              ...prev.slice(0, 99),
            ]);
          }

          let delayNextQuestion = 3000;

          if (currentStreak === 3) {
            const praise = "Chính xác! Bé giỏi quá, 3 câu đúng liên tiếp rồi!";
            setMessage("🎉 " + praise);
            speak(praise);
            delayNextQuestion = 3500;
          } else if (currentStreak === 5) {
            const praise = "Tuyệt vời! Đúng 5 câu liên tiếp rồi, tặng bé một Thỏ Thông Thái!";
            setMessage("🐰 " + praise);
            speak(praise);
            
            setShowBigRabbit(true);
            setTimeout(() => {
              setShowBigRabbit(false);
            }, 6000);

            delayNextQuestion = 6500;
          } else if (currentStreak === 10) {
            const praise = "Quá đỉnh! Bé trả lời đúng 10 câu liên tiếp! Bé là thiên tài toán học!";
            setMessage("🎆 " + praise);
            speak(praise);
            
            triggerFireworks();
            delayNextQuestion = 4500;
          } else if (currentStreak >= 15 && currentStreak % 5 === 0) {
            const praise = `Phi thường! Bé đã đúng ${currentStreak} câu liên tiếp! Siêu cao thủ toán học!`;
            setMessage("🌟 " + praise);
            speak(praise);
            
            triggerFireworks();
            delayNextQuestion = 5000;
          } else {
            const praise = isFirstAttempt.current ? "Chính xác!" : "Đúng rồi!";
            setMessage(isFirstAttempt.current ? "🎉 " + praise : "👏 " + praise);
            speak(praise);
            delayNextQuestion = 2500;
          }

          setTimeout(() => {
            generateQuestion();
            setMessage("");
          }, delayNextQuestion);

        } else {
          setStreak(0);

          wrongQuestionsQueue.current.push({
            text: question.text,
            result: question.result
          });

          isFirstAttempt.current = false;

          setMessage(`❌ Sai rồi. Đáp án đúng là ${question.result}`);
          speak(`Sai rồi. Đáp án đúng là ${question.result}`);

          setHistory(prev => [
            { q: question.text, a: selectedVal, ok: false },
            ...prev.slice(0, 99),
          ]);
        }
      };

      const getModeInfo = () => {
        if (mode === "+") return `Cộng (Kết quả ≤ ${maxNumber})`;
        if (mode === "-") return `Trừ (Phạm vi ≤ ${maxNumber})`;
        if (mode === "*") return `Nhân (Cửu chương ≤ ${maxTable})`;
        if (mode === "/") return `Chia (Cửu chương ≤ ${maxTable})`;
        return `Hỗn hợp tất cả`;
      };

      // =========================
      // UI
      // =========================

      return (
        <div className="min-h-screen bg-gradient-to-b from-sky-200 via-pink-100 to-amber-100 p-3 sm:p-6 flex flex-col justify-between items-center relative overflow-x-hidden">
          
          {/* MÀN HÌNH KHÓA KHI HẾT GIỜ HỌC */}
          {isTimeUp && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-md p-4">
              <div className="bg-white p-6 sm:p-8 rounded-[40px] border-8 border-rose-400 shadow-2xl flex flex-col items-center max-w-sm text-center animate-pop">
                <div className="text-6xl mb-3">⏰</div>
                <h3 className="text-2xl sm:text-3xl font-black text-rose-600 mb-2">
                  Đã hết giờ học!
                </h3>
                <p className="text-gray-600 font-bold mb-6 text-sm sm:text-base">
                  Bé hãy nghỉ ngơi một chút nhé! Nhập <span className="text-pink-600 font-black text-lg">1</span> để tiếp tục học.
                </p>

                <form onSubmit={handleUnlock} className="w-full space-y-3">
                  <input
                    type="number"
                    value={unlockCode}
                    onChange={(e) => setUnlockCode(e.target.value)}
                    placeholder="Nhập số 1..."
                    className="w-full text-center text-2xl font-black p-3.5 border-4 border-purple-300 rounded-2xl focus:outline-none focus:border-purple-500 bg-purple-50"
                    autoFocus
                  />
                  {unlockError && (
                    <p className="text-xs font-bold text-rose-500 animate-bounce">{unlockError}</p>
                  )}
                  <button
                    type="submit"
                    className="w-full bg-emerald-500 hover:bg-emerald-600 text-white text-lg font-black py-3 rounded-2xl shadow-lg border-b-4 border-emerald-700 active:border-b-0 btn-bounce"
                  >
                    🔓 Tiếp tục học
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* POPUP THỎ THÔNG THÁI (ĐÚNG 5 CÂU) */}
          {showBigRabbit && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
              <div className="bg-white p-6 sm:p-8 rounded-[40px] border-8 border-amber-300 shadow-2xl flex flex-col items-center animate-pop max-w-xs sm:max-w-sm text-center">
                <img 
                  src="./tho.jpg" 
                  alt="Thỏ Thông Thái" 
                  className="w-44 h-44 sm:w-56 sm:h-56 object-cover rounded-3xl drop-shadow-xl border-4 border-pink-400 mb-4"
                  onError={(e) => { e.target.src = './tho.png'; }}
                />
                <h3 className="text-2xl sm:text-3xl font-black text-pink-600 animate-bounce">
                  🐰 Tặng Bé 1 Thỏ Thông Thái!
                </h3>
                <p className="text-amber-700 font-bold mt-1 text-sm sm:text-base">
                  Đã xuất sắc trả lời đúng 5 câu liên tiếp!
                </p>
              </div>
            </div>
          )}

          {/* HEADER BAR */}
          <div className="w-full max-w-4xl flex justify-between items-center bg-white/80 backdrop-blur-md rounded-3xl p-3 sm:p-4 shadow-lg border-2 border-white mb-4">
            <div className="flex items-center gap-1.5 sm:gap-3">
              <div className="bg-amber-100 border-2 border-amber-300 rounded-2xl px-2.5 sm:px-4 py-1.5 flex items-center gap-1.5 shadow-inner">
                <span className="text-lg sm:text-2xl">🏆</span>
                <span className="text-lg sm:text-2xl font-black text-amber-600">{score}</span>
              </div>
              <div className="bg-pink-100 border-2 border-pink-300 rounded-2xl px-2.5 sm:px-4 py-1.5 flex items-center gap-1.5 shadow-inner">
                <span className="text-lg sm:text-2xl">⭐</span>
                <span className="text-lg sm:text-2xl font-black text-pink-500">{stars}</span>
              </div>
              <div className="bg-orange-100 border-2 border-orange-300 rounded-2xl px-2.5 sm:px-4 py-1.5 flex items-center gap-1 shadow-inner" title="Chuỗi câu đúng liên tiếp">
                <span className="text-lg sm:text-2xl">🔥</span>
                <span className="text-lg sm:text-2xl font-black text-orange-600">{streak}</span>
              </div>
            </div>

            {/* ĐỒNG HỒ ĐẾM NGƯỢC */}
            <div className="flex items-center gap-2">
              <div className={`border-2 rounded-2xl px-3 py-1.5 flex items-center gap-1.5 font-black text-sm sm:text-lg shadow-inner ${
                timeLeft <= 60 ? "bg-rose-100 border-rose-300 text-rose-600 animate-pulse" : "bg-sky-100 border-sky-300 text-sky-700"
              }`}>
                <span>⏳</span>
                <span>{formatTime(timeLeft)}</span>
              </div>

              <button
                onClick={() => setIsSettingsOpen(true)}
                className="bg-purple-500 hover:bg-purple-600 text-white p-2.5 sm:p-3 rounded-2xl shadow-md border-b-4 border-purple-700 active:border-b-0 btn-bounce flex items-center gap-1.5 font-bold text-base sm:text-lg"
              >
                ⚙️ <span className="hidden sm:inline">Cài đặt</span>
              </button>
            </div>
          </div>

          {/* MAIN CONTENT AREA */}
          <div className="w-full max-w-4xl grid lg:grid-cols-3 gap-6 my-auto">
            
            {/* THẺ TÍNH TOÁN CHÍNH */}
            <div className="lg:col-span-2 bg-white/90 backdrop-blur-md rounded-[35px] shadow-xl p-6 sm:p-8 border-4 border-white relative flex flex-col justify-between">
              
              {/* CHÚ THỎ VÀ NÚT ĐỌC ĐỀ */}
              <div className="flex items-center justify-between gap-4 mb-2">
                <div className="flex items-center gap-3">
                  <img 
                    src="./tho.jpg" 
                    alt="Thỏ Học Toán" 
                    className="w-16 h-16 sm:w-20 sm:h-20 object-cover rounded-2xl rabbit-3d-anim drop-shadow-md border-2 border-pink-300"
                    onError={(e) => { e.target.src = './tho.png'; }}
                  />
                  <div>
                    <h2 className="text-lg font-black text-purple-600">Thỏ Thông Thái</h2>
                    <p className="text-xs font-bold text-gray-500">{getModeInfo()}</p>
                  </div>
                </div>

                <button
                  onClick={() => speak(formatSpeakText(question?.text || ""))}
                  className="bg-sky-400 hover:bg-sky-500 text-white p-3 rounded-2xl shadow-md border-b-4 border-sky-600 active:border-b-0 btn-bounce flex items-center gap-1 font-bold text-sm"
                >
                  🔊 <span className="hidden sm:inline">Đọc đề</span>
                </button>
              </div>

              {/* PHÉP TÍNH */}
              <div className="text-center my-8">
                <div className="text-6xl sm:text-8xl font-black text-slate-800 tracking-wider drop-shadow-md">
                  {question?.text || "..."}
                </div>
              </div>

              {/* ĐÁP ÁN TRẮC NGHIỆM */}
              <div className="space-y-4">
                <div className="grid grid-cols-2 gap-4 max-w-md mx-auto">
                  {choices.map((item, index) => (
                    <button
                      key={index}
                      onClick={() => handleSelectAnswer(item)}
                      className={`text-3xl sm:text-4xl font-black py-5 rounded-3xl shadow-md border-b-4 transition-all btn-bounce ${
                        answer === item.toString()
                          ? "bg-purple-600 text-white border-purple-800 scale-105"
                          : "bg-amber-100 hover:bg-amber-200 text-amber-900 border-amber-300"
                      }`}
                    >
                      {item}
                    </button>
                  ))}
                </div>
              </div>

              {/* THÔNG BÁO VÀ BỎ QUA */}
              <div className="mt-6 flex flex-col items-center min-h-[4rem] justify-center">
                {message && (
                  <div className="text-lg sm:text-2xl font-black text-pink-600 animate-pulse text-center">
                    {message}
                  </div>
                )}
                {!message && (
                  <button
                    onClick={() => {
                      setStreak(0);
                      generateQuestion();
                    }}
                    className="text-amber-600 hover:text-amber-700 font-bold text-sm flex items-center gap-1 underline underline-offset-4"
                  >
                    🎲 Bỏ qua, đổi câu khác
                  </button>
                )}
              </div>

            </div>

            {/* SIDEBAR: LỊCH SỬ BÀI LÀM */}
            <div className="bg-white/80 backdrop-blur-md rounded-[35px] shadow-xl p-6 border-4 border-white flex flex-col justify-between">
              <div>
                <div className="text-xl font-black text-slate-700 mb-4 flex items-center justify-between">
                  <span className="flex items-center gap-2">📚 Lịch sử bài làm</span>
                  <span className="text-xs px-2.5 py-1 bg-purple-100 text-purple-700 rounded-full font-bold">
                    {history.length}/100
                  </span>
                </div>

                <div className="space-y-2.5 h-[320px] lg:h-[420px] overflow-y-auto pr-1">
                  {history.length === 0 && (
                    <div className="text-center text-gray-400 py-8 font-bold">
                      Chưa có kết quả nào.<br/>Bé chọn đáp án nhé! ⭐
                    </div>
                  )}

                  {history.map((item, index) => (
                    <div
                      key={index}
                      className={`rounded-2xl p-3 text-sm sm:text-base font-bold flex justify-between items-center border-2 ${
                        item.ok
                          ? "bg-emerald-50 text-emerald-700 border-emerald-200"
                          : "bg-rose-50 text-rose-700 border-rose-200"
                      }`}
                    >
                      <span className="truncate max-w-[140px]">{item.q}</span>
                      <span className="px-2 py-0.5 rounded-xl bg-white/60 shrink-0">
                        {item.a} {item.ok ? "✅" : "❌"}
                      </span>
                    </div>
                  ))}
                </div>
              </div>

              {history.length > 0 && (
                <button
                  onClick={() => {
                    setHistory([]);
                    wrongQuestionsQueue.current = [];
                  }}
                  className="w-full text-xs font-bold text-gray-400 hover:text-rose-500 mt-4 text-center"
                >
                  Xóa lịch sử & câu làm sai
                </button>
              )}
            </div>

          </div>

          {/* MODAL CÀI ĐẶT */}
          {isSettingsOpen && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-[35px] p-6 sm:p-8 max-w-md w-full shadow-2xl border-4 border-purple-200 relative max-h-[90vh] overflow-y-auto">
                
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-2xl font-black text-purple-700 flex items-center gap-2">
                    ⚙️ Tùy chọn học tập
                  </h3>
                  <button
                    onClick={() => setIsSettingsOpen(false)}
                    className="text-gray-400 hover:text-gray-600 text-2xl font-bold w-10 h-10 rounded-full flex items-center justify-center bg-gray-100"
                  >
                    ✕
                  </button>
                </div>

                {/* CÀI ĐẶT THỜI GIAN HỌC */}
                <div className="mb-6 bg-sky-50 p-4 rounded-2xl border-2 border-sky-200">
                  <label className="block text-sm font-black text-sky-800 mb-2 uppercase tracking-wider">
                    ⏱️ Thời gian học mỗi lần
                  </label>
                  <div className="grid grid-cols-3 gap-2">
                    {[15, 30, 45].map((mins) => (
                      <button
                        key={mins}
                        onClick={() => handleSelectDuration(mins)}
                        className={`py-2.5 rounded-xl text-base font-bold border-2 transition-all ${
                          selectedMinutes === mins
                            ? "bg-sky-500 text-white border-sky-600 shadow-md scale-105"
                            : "bg-white border-sky-200 text-sky-800 hover:bg-sky-100"
                        }`}
                      >
                        {mins} Phút
                      </button>
                    ))}
                  </div>
                </div>

                {/* TÙY CHỌN PHÉP TÍNH */}
                <div className="mb-6">
                  <label className="block text-sm font-black text-gray-500 mb-3 uppercase tracking-wider">
                    🧮 Chọn Phép tính
                  </label>
                  <div className="grid grid-cols-3 gap-2">
                    <button
                      onClick={() => setMode("+")}
                      className={`py-3 rounded-2xl text-sm font-bold border-2 transition-all ${
                        mode === "+"
                          ? "bg-pink-500 text-white border-pink-600 shadow-md"
                          : "bg-gray-50 border-gray-200 text-gray-600 hover:bg-gray-100"
                      }`}
                    >
                      ➕ Cộng
                    </button>
                    <button
                      onClick={() => setMode("-")}
                      className={`py-3 rounded-2xl text-sm font-bold border-2 transition-all ${
                        mode === "-"
                          ? "bg-sky-500 text-white border-sky-600 shadow-md"
                          : "bg-gray-50 border-gray-200 text-gray-600 hover:bg-gray-100"
                      }`}
                    >
                      ➖ Trừ
                    </button>
                    <button
                      onClick={() => setMode("*")}
                      className={`py-3 rounded-2xl text-sm font-bold border-2 transition-all ${
                        mode === "*"
                          ? "bg-amber-500 text-white border-amber-600 shadow-md"
                          : "bg-gray-50 border-gray-200 text-gray-600 hover:bg-gray-100"
                      }`}
                    >
                      ✖️ Nhân
                    </button>
                    <button
                      onClick={() => setMode("/")}
                      className={`py-3 rounded-2xl text-sm font-bold border-2 transition-all ${
                        mode === "/"
                          ? "bg-indigo-500 text-white border-indigo-600 shadow-md"
                          : "bg-gray-50 border-gray-200 text-gray-600 hover:bg-gray-100"
                      }`}
                    >
                      ➗ Chia
                    </button>
                    <button
                      onClick={() => setMode("mix")}
                      className={`col-span-2 py-3 rounded-2xl text-sm font-bold border-2 transition-all ${
                        mode === "mix"
                          ? "bg-emerald-500 text-white border-emerald-600 shadow-md"
                          : "bg-gray-50 border-gray-200 text-gray-600 hover:bg-gray-100"
                      }`}
                    >
                      🎲 Hỗn hợp (Cả 4)
                    </button>
                  </div>
                </div>

                {/* CÀI ĐẶT DÀNH CHO PHÉP NHÂN / CHIA */}
                {(mode === "*" || mode === "/" || mode === "mix") && (
                  <div className="mb-6 bg-amber-50 p-4 rounded-2xl border-2 border-amber-200">
                    <label className="block text-sm font-black text-amber-800 mb-2 uppercase tracking-wider">
                      ✖️➗ Bảng cửu chương cao nhất: <span className="text-xl text-pink-600">Bảng {maxTable}</span>
                    </label>
                    <p className="text-xs text-amber-700 mb-3">Đề bài chỉ xuất hiện phép nhân/chia từ Bảng 1 đến Bảng {maxTable}</p>
                    <div className="grid grid-cols-4 gap-2">
                      {[2, 3, 4, 5, 6, 7, 8, 9].map((tbl) => (
                        <button
                          key={tbl}
                          onClick={() => setMaxTable(tbl)}
                          className={`py-2 rounded-xl text-base font-bold border-2 transition-all ${
                            maxTable === tbl
                              ? "bg-amber-500 text-white border-amber-600 shadow-md scale-105"
                              : "bg-white border-amber-200 text-amber-800 hover:bg-amber-100"
                          }`}
                        >
                          Bảng {tbl}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {/* CÀI ĐẶT DÀNH CHO PHÉP CỘNG / TRỪ */}
                {(mode === "+" || mode === "-" || mode === "mix") && (
                  <div className="mb-8">
                    <label className="block text-sm font-black text-gray-500 mb-2 uppercase tracking-wider">
                      🎯 Phạm vi kết quả tối đa
                    </label>
                    <div className="grid grid-cols-3 gap-2">
                      {[5, 10, 20, 50, 100].map((num) => (
                        <button
                          key={num}
                          onClick={() => setMaxNumber(num)}
                          className={`py-2.5 rounded-2xl text-lg font-bold border-2 transition-all ${
                            maxNumber === num
                              ? "bg-purple-500 text-white border-purple-600 shadow-md scale-105"
                              : "bg-gray-50 border-gray-200 text-gray-600 hover:bg-gray-100"
                          }`}
                        >
                          Tối đa {num}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                <button
                  onClick={() => setIsSettingsOpen(false)}
                  className="w-full bg-purple-600 hover:bg-purple-700 text-white text-lg font-black py-3.5 rounded-2xl shadow-lg border-b-4 border-purple-800 active:border-b-0 btn-bounce"
                >
                  Hoàn tất
                </button>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<BeHocToan />);

  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
